[package]
name = "cpg"
version = "0.2.2"
edition = "2021"
description = "CpG island analysis toolkit"
authors = ["Marcel Ferreira <marcel.ferreira@unesp.br>"]
license     = "MIT"
repository  = "https://github.com/marceelrf/cpg"
homepage    = "https://github.com/marceelrf/cpg"
keywords    = ["bioinformatics", "genomics", "cpg"]
categories  = ["command-line-utilities", "science"]
readme      = "README.md"

[[bin]]
name = "cpg"
path = "src/main.rs"

[lib]
name = "cpg"
path = "src/lib.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
bio        = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rayon      = "1"
indicatif  = "0.17"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"