[package]
name = "cpg"
version = "0.2.0"
edition = "2021"
description = "CpG island analysis toolkit"
authors = ["Marcel Ferreira <marceelrf@gmail.com>"]

[[bin]]
name = "cpg"
path = "src/main.rs"

[lib]
name = "cpg"
path = "src/lib.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
bio        = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rayon      = "1"
indicatif  = "0.17"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"